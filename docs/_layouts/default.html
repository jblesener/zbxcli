<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }} · {{ site.product }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body style="--accent: {{ site.accent }}">
    <header class="site-header">
      <div class="shell header-content">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.product }}</a>
        <a class="github-link" href="{{ site.repository }}">GitHub ↗</a>
      </div>
    </header>
    <div class="shell docs-layout">
      <aside class="sidebar" aria-label="Documentation navigation">
        <nav>
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/installation.html' | relative_url }}">Installation</a>
          <a href="{{ '/authentication.html' | relative_url }}">Authentication</a>
          <a href="{{ '/queries.html' | relative_url }}">Queries</a>
          <a href="{{ '/maintenance.html' | relative_url }}">Maintenance</a>
          <a href="{{ '/automation.html' | relative_url }}">Automation &amp; safety</a>
          <a href="{{ '/reference/' | relative_url }}">Command reference</a>
        </nav>
      </aside>
      <main class="content">
        {{ content }}
      </main>
    </div>
    <footer class="site-footer shell">MIT licensed · <a href="{{ site.repository }}">{{ site.product }} on GitHub</a></footer>
  </body>
</html>
