name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./...

  package:
    name: Package ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            archive: tar.gz
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            archive: tar.gz
          - name: windows-amd64
            goos: windows
            goarch: amd64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o dist/zbxcli${{ matrix.goos == 'windows' && '.exe' || '' }} .
      - name: Create archive
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.name }}
          ARCHIVE: ${{ matrix.archive }}
          BINARY: zbxcli${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip "zbxcli_${VERSION}_${TARGET}.zip" "$BINARY")
          else
            tar -C dist -czf "dist/zbxcli_${VERSION}_${TARGET}.tar.gz" "$BINARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/zbxcli_${{ github.ref_name }}_${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
